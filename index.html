<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vuzoll Warehouse</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
    <script src="js/admin.js" defer></script>
</head>
<body>

    <!-- HEADER (Z-Index 1000) -->
    <div class="header">
        <div class="top-row">
            <div style="display: flex; align-items: center; gap: 10px;">
                <button class="icon-btn burger-btn" id="menuBtn">☰</button>
                <div id="statusDot" class="status-dot disconnected"></div>
                <h2 id="pageTitle" style="margin:0;">Склад 📦</h2>
                <span id="userRoleBadge" class="role-badge">Loading...</span>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="icon-btn" id="logsBtn">📜</button>
                <button class="theme-btn" id="themeBtn">🌗</button>
            </div>
        </div>

        <div class="search-container" id="warehouseSearchBlock">
            <div class="input-wrapper">
                <input type="text" id="searchInput" placeholder="🔍 Знайти (ID або Назва)...">
                <div id="searchSpinner" class="spinner hidden"></div>
            </div>
            <div id="searchResults" class="search-results hidden"></div>
        </div>

        <div class="api-config" id="apiConfigBlock">
            <input type="text" id="apiUrlInput" placeholder="URL API" onchange="saveApiUrl()">
        </div>

        <div class="controls-row" id="warehouseControlsRow">
            <label style="font-size: 12px; color: var(--hint-color); display:flex; align-items:center;">Стандарт:</label>
            <select id="globalActionType">
                <option value="take">🔻 Взяти</option>
                <option value="restock">🚚 Додати</option>
                <option value="fact">📋 Факт</option>
            </select>
            <button class="scan-btn" id="scanBtn">📷 Скан</button>
        </div>
    </div>

    <!-- BURGER SIDE MENU -->
    <div id="sideMenuOverlay" class="side-menu-overlay hidden"></div>
    <nav id="sideMenu" class="side-menu hidden">
        <div class="side-menu-header">
            <h3>Меню</h3>
            <button class="close-btn" id="closeMenuBtn">✖</button>
        </div>
        <button class="side-menu-item active" id="menuWarehouse">Склад (головна)</button>
        <button class="side-menu-item" id="menuUsers">Керування користувачами</button>
        <button class="side-menu-item" id="menuParts">Керувати деталями</button>
    </nav>

    <!-- CONTENT: WAREHOUSE PAGE -->
    <div id="itemList" class="item-list page-warehouse">
        <div class="empty-state">
            <div style="font-size: 40px; margin-bottom: 10px;">📷</div>
            <p>Кошик пустий</p>
        </div>
    </div>

    <!-- CONTENT: USERS MANAGEMENT (ADMIN ONLY) -->
    <div id="usersPage" class="page hidden">
        <div class="page-header-row">
            <h3>Керування користувачами</h3>
            <button id="inviteUserBtn" class="action-btn">➕ Запросити користувача</button>
        </div>
        <div id="inviteStatus" class="inline-status hidden"></div>
        <div id="usersPageBody" class="page-body">
            <p class="hint-text">Щоб побачити список користувачів, натисніть у меню пункт цієї сторінки. Доступ тільки для Admin.</p>
            <div id="usersList" class="simple-list"></div>
        </div>
    </div>

    <!-- CONTENT: PARTS MANAGEMENT (ADMIN + MANAGER) -->
    <div id="partsPage" class="page hidden">
        <div class="page-header-row">
            <h3>Керувати деталями</h3>
            <button id="reloadPartsBtn" class="action-btn">🔄 Оновити</button>
        </div>
        <div id="partsPageBody" class="page-body">
            <p class="hint-text">Список всіх деталей з беку. Доступ для Admin та Manager.</p>
            <div id="partsList" class="item-list"></div>
        </div>
    </div>

    <div class="footer">
        <button id="submitBtn" class="submit-btn" disabled>Зберегти (0)</button>
    </div>

    <!-- 1. LOADING MODAL (Z-Index 900 - під хедером, над контентом) -->
    <div id="loadingModal" class="loading-modal hidden">
        <div class="loading-content">
            <div class="big-spinner"></div>
            <div id="loadingText" style="font-weight: bold;">Завантаження...</div>
            <div id="progressContainer" class="progress-container hidden">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>
    </div>

    <!-- 2. RESULT MODAL (Z-Index 2000 - поверх всього) -->
    <div id="resultModal" class="modal hidden">
        <div class="result-content">
            <div class="modal-header">
                <h3>Результат</h3>
                <button id="closeResultBtn" class="close-btn">✖</button>
            </div>
            <div id="resultText" class="result-list"></div>
            <button id="copyResultBtn" class="action-btn">📋 Копіювати результат</button>
        </div>
    </div>

    <!-- 3. LOGS MODAL (Z-Index 2000) -->
    <div id="logsModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Console Logs</h3>
                <button id="closeLogs" class="close-btn">✖</button>
            </div>
            <div class="logs-controls">
                <button id="copyLogsBtn" class="action-btn">📋 Копіювати</button>
                <button id="clearLogsBtn" class="action-btn danger">🗑 Очистити</button>
            </div>
            <pre id="logsArea">Пусто...</pre>
        </div>
    </div>

</body>
</html>
