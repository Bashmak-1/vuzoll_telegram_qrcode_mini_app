<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vuzoll Warehouse</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Підключаємо нові стилі -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/modals.css">

    <!-- Підключаємо скрипти (порядок важливий!) -->
    <script src="js/config.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/router.js" defer></script>
    <script src="js/main.js" defer></script>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <div class="top-row">
            <div style="display: flex; align-items: center; gap: 10px;">
                <!-- Кнопка Бургер -->
                <button class="icon-btn burger-btn" id="burgerBtn">☰</button>

                <div id="statusDot" class="status-dot disconnected"></div>
                <h2 id="pageTitle" style="margin:0;">Склад</h2>
                <span id="userRoleBadge" class="role-badge">...</span>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="icon-btn" id="logsBtn">📜</button>
                <button class="theme-btn" id="themeBtn">🌗</button>
            </div>
        </div>

        <!-- Пошук і налаштування (тільки для головної сторінки) -->
        <div id="mainPageControls">
            <div class="search-container">
                <div class="input-wrapper">
                    <input type="text" id="searchInput" placeholder="🔍 Знайти (ID або Назва)...">
                    <div id="searchSpinner" class="spinner hidden"></div>
                </div>
                <div id="searchResults" class="search-results hidden"></div>
            </div>

            <div class="api-config">
                <input type="text" id="apiUrlInput" placeholder="URL API" onchange="saveApiUrl()">
            </div>

            <div class="controls-row">
                <label class="hint-label">Стандарт:</label>
                <select id="globalActionType">
                    <option value="take">🔻 Взяти</option>
                    <option value="restock">🚚 Додати</option>
                    <option value="fact">📋 Факт</option>
                </select>
                <button class="scan-btn" id="scanBtn">📷 Скан</button>
            </div>
        </div>
    </div>

    <!-- SIDE MENU (BURGER) -->
    <div id="sideMenuOverlay" class="menu-overlay hidden"></div>
    <div id="sideMenu" class="side-menu hidden">
        <div class="menu-header">Меню <button id="closeMenuBtn" class="close-btn">✖</button></div>
        <nav>
            <!-- Головна залишається тут -->
            <button class="menu-item active" onclick="toggleMenu(false)">🏠 Склад (головна)</button>

            <!-- Ця кнопка тепер веде на users.html -->
            <a href="users.html" class="menu-item" style="text-decoration: none; display: block;">
                👥 Користувачі (Admin)
            </a>

            <a href="parts.html" class="menu-item" style="text-decoration: none; display: block;">
                ⚙️ Керувати деталями</a>
        </nav>
    </div>

    <!-- СТОРІНКИ -->
    <div id="pagesContainer">

        <!-- 1. ГОЛОВНА (СКЛАД) -->
        <div id="page-home" class="page-block active">
            <div id="itemList" class="item-list">
                <div class="empty-state">
                    <div style="font-size: 40px; margin-bottom: 10px;">📷</div>
                    <p>Кошик пустий</p>
                </div>
            </div>
            <div class="footer">
                <button id="submitBtn" class="submit-btn" disabled>Зберегти (0)</button>
            </div>
        </div>

        <!-- 2. КОРИСТУВАЧІ -->
        <div id="page-users" class="page-block hidden">
            <div class="page-actions">
                <button class="action-btn primary" id="inviteUserBtn">➕ Запросити користувача</button>
            </div>
            <div id="usersList" class="data-list">
                <!-- Сюди завантажаться юзери -->
            </div>
        </div>

        <!-- 3. ДЕТАЛІ -->
        <div id="page-parts" class="page-block hidden">
            <div class="page-actions">
                <button class="action-btn" id="refreshPartsBtn">🔄 Оновити список</button>
            </div>
            <div id="partsList" class="data-list">
                <!-- Сюди завантажаться деталі -->
            </div>
        </div>

    </div>

    <!-- МОДАЛКИ (Loading, Result, Logs) -->
    <!-- ... (код модалок Loading, Result, Logs такий самий, як був) ... -->
    <div id="loadingModal" class="loading-modal hidden">
        <div class="loading-content">
            <div class="big-spinner"></div>
            <div id="loadingText" style="font-weight: bold;">Завантаження...</div>
            <div id="progressContainer" class="progress-container hidden">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>
    </div>

    <div id="resultModal" class="modal hidden">
        <div class="result-content">
            <div class="modal-header">
                <h3>Результат</h3>
                <button id="closeResultBtn" class="close-btn">✖</button>
            </div>
            <div id="resultText" class="result-list"></div>
            <button id="copyResultBtn" class="action-btn">📋 Копіювати результат</button>
        </div>
    </div>

    <div id="logsModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Logs</h3><button id="closeLogs" class="close-btn">✖</button>
            </div>
            <div class="logs-controls">
                <button id="copyLogsBtn" class="action-btn">📋 Копіювати</button>
                <button id="clearLogsBtn" class="action-btn danger">🗑 Очистити</button>
            </div>
            <pre id="logsArea">Пусто...</pre>
        </div>
    </div>

</body>

</html>
